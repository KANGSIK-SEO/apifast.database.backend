<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}함께하는 할 일 보드{% endblock %}</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f5f7fb; }
      body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
      header, .row, .actions { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
      header { padding: 1rem 0; border-bottom: 1px solid #dce2ec; }
      main { padding: 1.5rem 0; }
      a { color: #2459a6; }
      .button, button { display: inline-block; padding: .5rem .85rem; border: 1px solid #bbc6d8; border-radius: 6px; background: white; color: #172033; text-decoration: none; cursor: pointer; font: inherit; }
      .primary { background: #2459a6; color: white; border-color: #2459a6; }
      .card { margin: 1rem 0; padding: 1rem; border: 1px solid #dce2ec; border-radius: 8px; background: white; }
      label { display: block; margin: .9rem 0 .25rem; font-weight: 600; }
      input, textarea { box-sizing: border-box; width: 100%; padding: .65rem; border: 1px solid #bbc6d8; border-radius: 5px; font: inherit; }
      textarea { min-height: 6rem; }
      .muted { color: #657086; }
      .error { padding: .75rem; border-radius: 6px; background: #fff0f0; color: #a12626; }
      .status { display: inline-block; padding: .15rem .5rem; border-radius: 999px; background: #fff3d6; color: #795400; font-size: .9rem; }
      .status.completed { background: #e0f5e9; color: #17643a; }
      form.inline { display: inline; }
    </style>
  </head>
  <body>
    <header>
      <a href="/" style="color:inherit;text-decoration:none"><strong>함께하는 할 일 보드</strong></a>
      <nav>
        {% if user %}
          <span>{{ user.name }}님 환영합니다</span>
          <a href="/projects/">내 프로젝트</a>
          <form class="inline" action="/logout" method="post"><button type="submit">로그아웃</button></form>
        {% else %}
          <a href="/login">로그인</a>
        {% endif %}
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
